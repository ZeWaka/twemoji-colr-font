name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build '${{matrix.family}}'"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Only Chromium (WebView2/CEF) is targeted, so ship COLRv1 as WOFF2.
        # The intermediate TTF is published too (e.g. for gen-segoeui.py).
        include:
          - {
              file: "Twemoji_GlyfColr1.woff2",
              ttf: "Twemoji_GlyfColr1.ttf",
              family: "Twemoji - GlyfColr1",
              color: glyf_colr_1,
            }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5

      - name: Build Font
        run: uv run generate.py -o "${{matrix.file}}" --family "${{matrix.family}}" ${{matrix.color}}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.file}}
          path: |
            build/${{matrix.file}}
            build/${{matrix.ttf}}

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (contains(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - run: ls -la artifacts

      - name: Check Release
        id: is-rel
        run: |
          set +e;
          git describe --exact-match --match 'v*' &> /dev/null;
          is_tagged=$?
          echo "IS_TAGGED=$is_tagged" >> "$GITHUB_OUTPUT";
          if [[ "$is_tagged" == "0" ]]; then
            echo "TAG=$(git describe --exact-match --match 'v*')" >> "$GITHUB_OUTPUT";
          fi
        shell: bash

      - name: Hash Files
        run: |
          echo "<details><summary>Hashes</summary>" >> body.txt
          echo "" >> body.txt
          echo "| File | Hash |" >> body.txt
          echo "|---|---|" >> body.txt
          for file in $(find artifacts); 
          do 
            if [ ! -d "$file" ]; then
              echo "| $(basename -- "$file") | $(sha256sum "$file" | cut -d " " -f 1) |" >> body.txt;
            fi;
          done
          echo "</details>" >> body.txt
        shell: bash

      - name: Regular release
        uses: ncipollo/release-action@v1
        if: steps.is-rel.outputs.IS_TAGGED == '0'
        with:
          artifacts: "artifacts/**/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: false
          allowUpdates: true
          draft: true
          bodyFile: body.txt
          prerelease: false
          name: ${{ steps.is-rel.outputs.TAG }}
          tag: ${{ steps.is-rel.outputs.TAG }}

      - name: Nightly release
        uses: ncipollo/release-action@v1
        if: steps.is-rel.outputs.IS_TAGGED != '0'
        with:
          artifacts: "artifacts/**/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: false
          replacesArtifacts: true
          allowUpdates: true
          bodyFile: body.txt
          prerelease: true
          name: Nightly Release
          tag: nightly-build

      - name: Update nightly-build tag
        if: steps.is-rel.outputs.IS_TAGGED != '0'
        run: |
          git tag -f nightly-build
          git push -f origin nightly-build
